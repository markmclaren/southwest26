<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South West Visit — Summer 2026</title>

  <!-- Google Fonts: Playfair Display + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">
          <i class="bi bi-compass"></i>
        </span>
        <div class="header-text">
          <h1 class="mb-0">South West England</h1>
          <span class="title-rule" aria-hidden="true"></span>
          <p class="mb-0 subtitle">
            <span class="subtitle-trip">Family Visit</span>
            <span class="subtitle-dot" aria-hidden="true"></span>
            <span class="subtitle-season">Summer 2026</span>
          </p>
        </div>
      </div>
      <div class="header-badge" aria-hidden="true">
        <i class="bi bi-geo-alt-fill"></i>
        <span>34 Places</span>
      </div>
    </div>
  </header>

  <!-- ── FILTER BAR ─────────────────────────────────────────── -->
  <nav class="filter-bar sticky-top px-3 px-md-5" id="filterBar">

    <!-- Row 1: Day filter -->
    <div class="filter-row day-filter-row d-flex flex-wrap align-items-center gap-2 py-2">
      <span class="filter-label me-1">
        <i class="bi bi-calendar3"></i> Day:
      </span>
      <button class="btn btn-filter active" data-filter="all">All</button>
      <!-- Day buttons injected by JS -->
      <div class="day-select-wrap ms-auto">
        <label class="visually-hidden" for="daySelect">Day</label>
        <select id="daySelect" class="form-select form-select-sm day-select" aria-label="Select day">
          <option value="all">All</option>
        </select>
      </div>
    </div>

    <div class="filter-divider"></div>

    <!-- Row 2: Category toggles -->
    <div class="filter-row d-flex flex-wrap align-items-center gap-2 py-2">
      <span class="filter-label me-1">
        <i class="bi bi-funnel"></i> Show:
      </span>
      <button class="btn btn-cat-toggle active" data-cat="Itinerary Stop" title="Places to visit on the itinerary">
        <span class="dot dot-stop"></span> Itinerary Stops
      </button>
      <button class="btn btn-cat-toggle active" data-cat="Food Option" title="Recommended food stops tied to specific days">
        <span class="dot dot-food"></span> Food Options
      </button>
      <button class="btn btn-toggle-list ms-auto" id="toggleListBtn">
        <i class="bi bi-layout-sidebar"></i> <span class="btn-text">Hide List</span>
      </button>

    </div>

  </nav>

  <!-- ── MAIN LAYOUT ────────────────────────────────────────── -->
  <main class="container-fluid px-0">
    <div class="row g-0 main-row">

      <!-- ── SIDEBAR ──────────────────────────────────────────── -->
      <aside class="col-12 col-lg-4 col-xl-3 sidebar" id="sidebar">
        <div class="sidebar-inner">
          <!-- Place list -->
          <ul class="place-list list-unstyled mb-0" id="placeList"></ul>
        </div>
      </aside>

      <!-- ── MAP ──────────────────────────────────────────────── -->
      <section class="col-12 col-lg-8 col-xl-9 map-section">
        <div id="map"></div>
      </section>

    </div>
  </main>

  <!-- ── PLACE DETAIL PANEL (slide-in) ─────────────────────── -->
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close btn btn-sm" id="detailClose" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
    <div class="detail-body" id="detailBody"></div>
  </div>
  <div class="detail-overlay" id="detailOverlay"></div>

  <!-- ── SCRIPTS ───────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
